packages:
  - packages/*
  - toolkit/*
  - playground
  - repl
  - website

allowBuilds:
  '@vscode/vsce-sign': true
  core-js: false
  esbuild: true
  keytar: true

minimumReleaseAge: 0

# One TypeScript across the store: without this, transitive copies (pulled in
# by the monaco-vscode stack) shadow @volar/typescript's peer and split the
# tsserver types into two incompatible identities.
overrides:
  typescript: ^6.0.3
