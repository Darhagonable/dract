<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#23272f" />
		<title>Octane — React's programming model, compiled</title>
		<script>
			(function () {
				var s = null;
				try {
					s = localStorage.getItem('octane-theme');
				} catch (e) {}
				try {
					var t = (s === 'light' || s === 'dark') ? s : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
					document.documentElement.setAttribute('data-theme', t);
					var m = document.querySelector('meta[name="theme-color"]');
					if (m) m.setAttribute('content', t === 'light' ? '#ffffff' : '#23272f');
				} catch (e) {}
			})();
		</script>
		<style>
			:root {
				--bg: #23272f;
				--panel: #2b3138;
				--code-bg: #16181d;
				--text: #f4eee8;
				--text-body: #d5d9e0;
				--text-secondary: #99a1b3;
				--accent: #ff415a;
				--accent-hover: #ff5d72;
				--accent-text: #ff5d72;
				--on-accent: #16181d;
				--border: rgba(255, 255, 255, 0.1);
				--border-strong: rgba(255, 255, 255, 0.22);
				--surface-subtle: rgba(255, 255, 255, 0.03);
				--surface: rgba(255, 255, 255, 0.06);
				--field-bg: rgba(22, 24, 29, 0.78);
				--surface-inset: rgba(22, 24, 29, 0.55);
				--success-text: #8ae8ae;
				--danger-text: #ff8797;
				--header-bg: rgba(35, 39, 47, 0.85);
				--header-bg-solid: rgba(35, 39, 47, 0.97);
				--topnav-height: 60px;
				--callout-note: #a9c2ff;
				--callout-important: #ffc56d;
				--callout-tip: #7ee2a7;
				--pkg-cmd: #ffb757;
				--pkg-arg: #addcff;
				color-scheme: dark;
			}
			:root[data-theme='light'] {
				--bg: #ffffff;
				--panel: #f4f5f7;
				--code-bg: #f6f8fa;
				--text: #1c2027;
				--text-body: #363c47;
				--text-secondary: #5c6473;
				--accent: #ff415a;
				--accent-hover: #c81e37;
				--accent-text: #d81f38;
				--on-accent: #ffffff;
				--border: rgba(0, 0, 0, 0.12);
				--border-strong: rgba(0, 0, 0, 0.22);
				--surface-subtle: rgba(0, 0, 0, 0.025);
				--surface: rgba(0, 0, 0, 0.04);
				--field-bg: #ffffff;
				--surface-inset: rgba(0, 0, 0, 0.03);
				--success-text: #1e7a45;
				--danger-text: #c81e37;
				--header-bg: rgba(255, 255, 255, 0.85);
				--header-bg-solid: rgba(255, 255, 255, 0.97);
				--callout-note: #2f5fd0;
				--callout-important: #a86400;
				--callout-tip: #1e7a45;
				--pkg-cmd: #953800;
				--pkg-arg: #0550ae;
				color-scheme: light;
			}
			* {
				box-sizing: border-box;
			}
			html {
				-webkit-text-size-adjust: 100%;
			}
			body {
				margin: 0;
				background: var(--bg);
				color: var(--text);
				font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
				line-height: 1.6;
				font-size: 16px;
			}
			code,
			pre,
			kbd,
			samp {
				font-family: 'SF Mono', SFMono-Regular, ui-monospace, Menlo, Consolas, monospace;
			}
			a {
				color: var(--accent-text);
				text-decoration: none;
			}
			a:hover {
				color: var(--accent-hover);
			}
			::selection {
				background: rgba(255, 65, 90, 0.45);
			}
			#repl-theme-toggle {
				position: fixed;
				bottom: 12px;
				right: 12px;
				z-index: 1000;
				padding: 6px 12px;
				border: 1px solid var(--border-strong);
				border-radius: 8px;
				background: var(--surface);
				color: var(--text-secondary);
				font-size: 12px;
				font-family: inherit;
				cursor: pointer;
			}
			#repl-theme-toggle:hover {
				color: var(--accent-text);
				border-color: var(--accent);
			}
		</style>
	</head>
	<body>
		<div id="__app"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
