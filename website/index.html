<!DOCTYPE html>
<html lang="en" class="h-full antialiased [font-feature-settings:'ss01']">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>DarTsx</title>
	<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend:wght@100..900&display=swap" rel="stylesheet">
	<script>
		let theme = localStorage.getItem('theme');
		if (!theme) theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
		if (theme === 'dark') document.documentElement.classList.add('dark');
	</script>
</head>
<body class="flex min-h-full bg-white dark:bg-slate-900">
	<app-root/>
	<script type="module" src="/src/main.ts"></script>
</body>
</html>
